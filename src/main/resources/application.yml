#################################### Spring (shared wiring - values from conf: below) ####################################
spring:
  application:
    name: ${conf.application.name}
  autoconfigure:
    # OpenAI starter registers optional modalities that require a key even when chat/embeddings use Ollama; exclude unless you set OPENAI_API_KEY for these features.
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  profiles:
    active: @activatedProperties@
  banner:
    location: classpath:banner/banner.txt
  main:
    allow-bean-definition-overriding: ${conf.main.allow-bean-definition-overriding:true}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      enabled: ${conf.multipart.enabled:true}
      file-size-threshold: ${conf.multipart.file-size-threshold:2KB}
      max-file-size: ${conf.multipart.max-file-size:200MB}
      max-request-size: ${conf.multipart.max-request-size:215MB}
  data:
    mongodb:
      # Optional MONGODB_URI for TLS / mongodb+srv / replica sets; else built from conf.mongodb.{host,port,database}
      uri: ${MONGODB_URI:mongodb://${conf.mongodb.host}:${conf.mongodb.port}/${conf.mongodb.database}}
  ai:
    # Chat / embedding "adapters": Spring AI wires the matching ChatModel + EmbeddingModel beans from starters on the classpath.
    # conf.ai.chat-provider / conf.ai.embedding-provider: ollama | openai | vertexai (see conf: and profile YAML below).
    model:
      chat: ${conf.ai.chat-provider}
      embedding: ${conf.ai.embedding-provider}
    ollama:
      base-url: ${conf.ollama.base-url}
      chat:
        options:
          model: ${conf.ollama.chat-model}
      embedding:
        options:
          model: ${conf.ollama.embedding-model}
    openai:
      api-key: ${conf.openai.api-key}
      chat:
        options:
          model: ${conf.openai.chat-model}
      embedding:
        options:
          model: ${conf.openai.embedding-model}
    vertex:
      ai:
        gemini:
          project-id: ${conf.vertex.gemini.project-id:}
          location: ${conf.vertex.gemini.location:us-central1}
          chat:
            options:
              model: ${conf.vertex.gemini.chat-model:gemini-2.0-flash}
#################################### / Spring ##########################################################################

#################################### Server ############################################################################
server:
  port: ${conf.server.port}
  servlet:
    context-path: /${conf.server.context-path}
#################################### / Server ##########################################################################

#################################### springdoc #########################################################################
springdoc:
  api-docs:
    enabled: ${conf.springdoc.api-docs-enabled}
  swagger-ui:
    enabled: ${conf.springdoc.swagger-ui-enabled}
#################################### / springdoc #######################################################################

#################################### Logging ###########################################################################
logging:
  level:
    root: ${conf.logging.level.root}
    ai_chat: ${conf.logging.level.ai-chat}
    org.springframework.web: ${conf.logging.level.org-springframework-web:INFO}
#################################### / Logging #########################################################################

#################################### Central configuration (override in application-{profile}.yml) #####################
conf:
  application:
    name: ai-chat
  main:
    allow-bean-definition-overriding: true
  multipart:
    enabled: true
    file-size-threshold: 2KB
    max-file-size: 200MB
    max-request-size: 215MB
  server:
    port: 8080
    context-path: ai-chat
  mongodb:
    host: localhost
    port: 27017
    database: ai
    # When MONGODB_URI is unset, URI is mongodb://{host}:{port}/{database}. Set MONGODB_URI in prod for TLS (e.g. ?tls=true or mongodb+srv://…).
  ai:
    # Switch LLM / embedder without code changes: ollama | openai | vertexai (match pom starters + credentials for that provider).
    chat-provider: ollama
    embedding-provider: ollama
  ollama:
    base-url: http://localhost:11434
    chat-model: llama3
    embedding-model: llama3
  openai:
    api-key: ${OPENAI_API_KEY:}
    chat-model: gpt-4o-mini
    embedding-model: text-embedding-3-small
  vertex:
    gemini:
      project-id: ${VERTEX_GCP_PROJECT_ID:}
      location: us-central1
      chat-model: gemini-2.0-flash
  springdoc:
    api-docs-enabled: true
    swagger-ui-enabled: true
  logging:
    level:
      root: INFO
      ai-chat: DEBUG
      org-springframework-web: INFO
  # Admin API: POST /admin/knowledge, list unknown-queries. Set api-key in prod + header X-Admin-Key.
  admin:
    enabled: true
    api-key: ${ADMIN_API_KEY:}
  # Short-term chat history (in-memory per JVM; see ARCHITECTURE.md).
  chat:
    history-max-messages: 20
    history-session-ttl-hours: 24
  rag:
    hybrid:
      enabled: true
      keyword-top-k: 20
      # Reciprocal-rank fusion weights; tune per domain.
      vector-weight: 1.0
      keyword-weight: 0.8
  # RAG KB: curated FAQ snippets (code) + SRS. Prefer kb/ssrp-srs-llm.md (LLM-friendly) over PDF when present.
  kb:
    srs-pdf-enabled: true
    srs-pdf-classpath: classpath:kb/ssrp-srs.pdf
    srs-use-markdown: true
    srs-markdown-classpath: classpath:kb/ssrp-srs-llm.md
    # Smaller, paragraph-based chunks + section headers in text improve retrieval vs long blind windows.
    srs-chunk-max-chars: 900
    srs-chunk-overlap: 200
    # Embedding identity metadata stamped on new KB chunks.
    embedding-metadata:
      # Set this to the active embedding model identifier you use operationally.
      # Default falls back to provider tag (ollama/openai/vertexai) for backward-safe rollout.
      model-tag: ${conf.ai.embedding-provider}
      version: v1
    # strict=false: allow mismatched docs (warn only). strict=true: skip mismatched docs in retrieval.
    embedding-compatibility:
      strict: true
  # Unknown query training pipeline (manual approval by default).
  unknown-training:
    enabled: true
    cron: "0 0 * * * *" # every hour
    batch-size: 50
    min-frequency: 2
    auto-approve: false # false = semi-auto with human approval
    max-drafts-per-run: 20
    max-imports-per-run: 20
    min-answer-chars: 80
    delete-processed-unknowns: false
#################################### / conf ############################################################################
