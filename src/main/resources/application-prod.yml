#################################### Profile: production ###############################################################
# Set MONGO_HOST, OLLAMA_BASE_URL, etc. in the environment; Swagger is off by default.
# For MongoDB with TLS or Atlas: set MONGODB_URI (overrides host/port/database from conf).

conf:
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DATABASE:ai}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:llama3}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:llama3}
  springdoc:
    api-docs-enabled: false
    swagger-ui-enabled: false
  logging:
    level:
      root: WARN
      ai-chat: INFO
      org-springframework-web: WARN
