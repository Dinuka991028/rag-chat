<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SSRP — Customer Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ocean: #0a4d68;
      --ocean-deep: #062e42;
      --sand: #f4f0e8;
      --ink: #1a2830;
      --muted: #5c6f7a;
      --accent: #e8a54b;
      --bubble-user: #d4e8f0;
      --bubble-ai: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Source Sans 3", system-ui, sans-serif;
      background: linear-gradient(165deg, var(--ocean-deep) 0%, var(--ocean) 42%, #0d6b8c 100%);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 1rem 2rem;
    }
    .shell {
      width: min(640px, 100%);
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--sand);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      overflow: hidden;
      min-height: min(85vh, 720px);
    }
    header {
      padding: 1.1rem 1.25rem;
      background: linear-gradient(90deg, rgba(10, 77, 104, 0.95), rgba(13, 107, 140, 0.92));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.35rem;
      font-weight: 500;
      margin: 0;
      letter-spacing: 0.02em;
    }
    header .badge {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: rgba(255, 255, 255, 0.15);
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
    }
    header a {
      color: rgba(255, 255, 255, 0.88);
      font-size: 0.88rem;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .msg {
      max-width: 92%;
      padding: 0.85rem 1rem;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 0.98rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--bubble-user);
      color: var(--ink);
      border-bottom-right-radius: 4px;
    }
    .msg.ai {
      align-self: flex-start;
      background: var(--bubble-ai);
      border: 1px solid rgba(10, 77, 104, 0.12);
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 12px rgba(10, 77, 104, 0.06);
    }
    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
      max-width: 100%;
    }
    .msg.error {
      align-self: center;
      background: #fde8e8;
      color: #8b1a1a;
      border: 1px solid #f0b4b4;
    }
    .msg.typing {
      align-self: flex-start;
      background: var(--bubble-ai);
      border: 1px solid rgba(10, 77, 104, 0.12);
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 12px rgba(10, 77, 104, 0.06);
      padding: 0.9rem 1.1rem;
    }
    .typing-bubble {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 1.1rem;
    }
    .typing-bubble .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.45;
      animation: typing-dot 1.25s ease-in-out infinite;
    }
    .typing-bubble .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-bubble .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-dot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
      30% { transform: translateY(-5px); opacity: 1; }
    }
    .composer {
      padding: 1rem 1.25rem 1.25rem;
      border-top: 1px solid rgba(10, 77, 104, 0.12);
      background: rgba(255, 255, 255, 0.65);
    }
    .row {
      display: flex;
      gap: 0.6rem;
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 52px;
      max-height: 160px;
      padding: 0.75rem 1rem;
      border: 1px solid rgba(10, 77, 104, 0.2);
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
    }
    textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: transparent;
    }
    button.send {
      align-self: flex-end;
      padding: 0.75rem 1.25rem;
      background: var(--ocean);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    button.send:hover:not(:disabled) {
      background: var(--ocean-deep);
    }
    button.send:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .hint {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>Customer assistant</h1>
        <span class="badge">Public · RAG</span>
      </div>
      <a href="index.html">← Demo home</a>
    </header>
    <div class="messages" id="messages" aria-live="polite"></div>
    <div class="composer">
      <div class="row">
        <textarea id="input" rows="2" placeholder="Ask about vessel registration, documents, or portal steps…" aria-label="Message"></textarea>
        <button type="button" class="send" id="send">Send</button>
      </div>
      <p class="hint">Answers use only the service knowledge base. For officer tools, use the officer demo.</p>
    </div>
  </div>
  <script>
    (function () {
      const messagesEl = document.getElementById("messages");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      let conversationId = null;
      let typingNode = null;

      function showTyping() {
        removeTyping();
        typingNode = document.createElement("div");
        typingNode.className = "msg typing";
        typingNode.setAttribute("role", "status");
        typingNode.setAttribute("aria-label", "Assistant is typing");
        typingNode.innerHTML =
          '<div class="typing-bubble" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
        messagesEl.appendChild(typingNode);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function removeTyping() {
        if (typingNode && typingNode.parentNode) {
          typingNode.remove();
        }
        typingNode = null;
      }

      function append(kind, text) {
        const div = document.createElement("div");
        div.className = "msg " + kind;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      append("system", "Welcome. Ask a question about SSRP services.");

      async function send() {
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        append("user", text);
        sendBtn.disabled = true;
        showTyping();
        try {
          const res = await fetch("chat/rag/conversation", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text,
              conversationId: conversationId,
              role: "customer",
            }),
          });
          if (!res.ok) {
            const errText = await res.text();
            throw new Error(errText || res.statusText);
          }
          const data = await res.json();
          if (data.conversationId) conversationId = data.conversationId;
          removeTyping();
          append("ai", data.reply || "(empty reply)");
        } catch (e) {
          removeTyping();
          append("error", "Could not reach the assistant. Is the server running at this URL? " + (e.message || ""));
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      }

      sendBtn.addEventListener("click", send);
      input.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" && !ev.shiftKey) {
          ev.preventDefault();
          send();
        }
      });
    })();
  </script>
</body>
</html>
