#################################### Profile: onsite - on-premises / government network ##################################
# Prefer setting env vars (MONGO_HOST, OLLAMA_BASE_URL, …) in deployment; defaults keep local fallbacks.

conf:
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DATABASE:ai}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:llama3}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:llama3}
  springdoc:
    api-docs-enabled: true
    swagger-ui-enabled: true
  logging:
    level:
      root: INFO
      ai-chat: INFO
      org-springframework-web: INFO
